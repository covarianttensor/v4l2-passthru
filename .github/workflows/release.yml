name: Build & Release Packages

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  build-arch-package:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root

    steps:
      - name: Initialize Arch keyring and install build/runtime dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm \
            base-devel git cmake pkgconf \
            alsa-lib gst-plugin-pipewire gst-plugins-base-libs gst-plugins-good gstreamer \
            hicolor-icon-theme qt6-base qt6-declarative qt6-multimedia qt6-multimedia-ffmpeg \
            qt6-svg systemd-libs

      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Arch pacman package with makepkg
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION="${GITHUB_REF_NAME#v}"

          useradd -m builder
          mkdir -p /build/pkg /build/out
          git archive --format=tar.gz --prefix="v4l2-passthru-${VERSION}/" HEAD \
            -o "/build/pkg/v4l2-passthru-${VERSION}.tar.gz"

          cp PKGBUILD /build/pkg/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" /build/pkg/PKGBUILD
          sed -i "s|^url=.*|url='https://github.com/${{ github.repository }}'|" /build/pkg/PKGBUILD

          TAR_SHA256=$(sha256sum "/build/pkg/v4l2-passthru-${VERSION}.tar.gz" | awk '{print $1}')
          sed -i "s/^sha256sums=.*/sha256sums=('${TAR_SHA256}')/" /build/pkg/PKGBUILD

          chown -R builder:builder /build
          su builder -c "cd /build/pkg && makepkg -f --noconfirm"

          cp /build/pkg/*.pkg.tar.zst /build/out/
          cp "/build/pkg/v4l2-passthru-${VERSION}.tar.gz" /build/out/
          (cd /build/out && sha256sum *.pkg.tar.zst > "v4l2-passthru-${VERSION}-x86_64.pkg.tar.zst.sha256")
          mkdir -p dist-arch
          cp /build/out/* dist-arch/

      - name: Upload Arch build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arch-artifacts
          path: dist-arch/*

  build-flatpak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Install Flatpak tools and KDE 6.11 runtime/SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user --noninteractive flathub org.kde.Platform//6.11 org.kde.Sdk//6.11

      - name: Build Flatpak bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist-flatpak
          flatpak-builder --user --disable-rofiles-fuse --repo=repo --force-clean \
            build-flatpak packaging/flatpak/io.github.covarianttensor.V4L2Passthru.yaml
          flatpak build-bundle repo "dist-flatpak/v4l2-passthru-${VERSION}-x86_64.flatpak" \
            io.github.covarianttensor.V4L2Passthru
          (cd dist-flatpak && sha256sum *.flatpak > "v4l2-passthru-${VERSION}-x86_64.flatpak.sha256")

      - name: Upload Flatpak build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-artifacts
          path: dist-flatpak/*

  build-appimage:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Install system build and GStreamer dependencies
        run: |
          sudo apt-get update
          # GitHub's ubuntu-22.04 image pre-installs slotted LLVM libunwind-*-dev packages
          # that conflict with Ubuntu's libunwind-dev required by libgstreamer1.0-dev.
          sudo apt-get remove -y 'libunwind-*-dev' || true
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config curl patchelf libfuse2 \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libudev-dev libasound2-dev libpulse-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pipewire

      - name: Install Qt 6.8 with QtMultimedia
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtmultimedia'

      - name: Build AppImage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x packaging/appimage/build-appimage.sh
          ./packaging/appimage/build-appimage.sh "${VERSION}" dist-appimage

      - name: Upload AppImage build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appimage-artifacts
          path: dist-appimage/*

  publish-release:
    needs: [build-arch-package, build-flatpak, build-appimage]
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release notes with install instructions
        run: |
          python3 -c '
          import glob, os, textwrap

          repo = "${{ github.repository }}"
          tag = os.environ["GITHUB_REF_NAME"]
          ver = tag.removeprefix("v")

          arch_pkgs = sorted(
              os.path.basename(p) for p in glob.glob("release-assets/*.pkg.tar.zst")
              if "-debug-" not in os.path.basename(p)
          )
          arch_pkg = arch_pkgs[0] if arch_pkgs else f"v4l2-passthru-{ver}-1-x86_64.pkg.tar.zst"
          arch_sha = f"v4l2-passthru-{ver}-x86_64.pkg.tar.zst.sha256"

          flatpak_pkg = f"v4l2-passthru-{ver}-x86_64.flatpak"
          flatpak_sha = f"v4l2-passthru-{ver}-x86_64.flatpak.sha256"

          appimage_pkg = f"v4l2-passthru-{ver}-x86_64.AppImage"
          appimage_sha = f"v4l2-passthru-{ver}-x86_64.AppImage.sha256"

          notes = textwrap.dedent(f"""\
          ## V4L2 Passthru {tag}

          Low-latency C++20 / Qt6 / QML desktop passthrough viewer for USB V4L2/UVC video capture devices and PipeWire/PulseAudio audio streams.

          ### Arch Linux Installation (`pacman`)

          1. Download `{arch_pkg}` and `{arch_sha}` (or via `curl`):

             ```bash
             curl -LO "https://github.com/{repo}/releases/download/{tag}/{arch_pkg}"
             curl -LO "https://github.com/{repo}/releases/download/{tag}/{arch_sha}"
             sha256sum -c "{arch_sha}" --ignore-missing
             ```

          2. Install with `pacman`:

             ```bash
             sudo pacman -U "./{arch_pkg}"
             ```

          ### Flatpak Installation (Any Linux Distro)

          1. Ensure Flathub is configured (needed once for the `org.kde.Platform//6.11` runtime):

             ```bash
             flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
             ```

          2. Download and install the `.flatpak` bundle:

             ```bash
             curl -LO "https://github.com/{repo}/releases/download/{tag}/{flatpak_pkg}"
             curl -LO "https://github.com/{repo}/releases/download/{tag}/{flatpak_sha}"
             sha256sum -c "{flatpak_sha}"
             flatpak install --user -y "./{flatpak_pkg}"
             ```

          3. Run:

             ```bash
             flatpak run io.github.covarianttensor.V4L2Passthru
             ```

          ### AppImage (Portable Binary)

          ```bash
          curl -LO "https://github.com/{repo}/releases/download/{tag}/{appimage_pkg}"
          curl -LO "https://github.com/{repo}/releases/download/{tag}/{appimage_sha}"
          sha256sum -c "{appimage_sha}"
          chmod +x "./{appimage_pkg}"
          ./"{appimage_pkg}"
          ```

          ### Build from Source

          See the [README](https://github.com/{repo}/blob/{tag}/README.md#option-5-build-from-source-cmake) for manual CMake and `makepkg` build instructions.
          """)

          with open("/tmp/release-notes.md", "w", encoding="utf-8") as f:
              f.write(notes)
          '

      - name: Create GitHub Release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          name: "V4L2 Passthru ${{ github.ref_name }}"
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/*
